<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>USATO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#000;overflow:hidden;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text;font:inherit;outline:none}
svg{display:block}
#phone{position:fixed;inset:0;overflow:hidden;background:#000}
#scr{position:absolute;inset:0;overflow:hidden}
#desk{display:none;position:fixed;left:24px;top:24px;max-width:240px;color:#666;font-size:13px;line-height:1.5}
@media (min-width:700px) and (pointer:fine){
 #phone{inset:auto;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--sc,1));border-radius:52px;box-shadow:0 0 0 11px #0d0d0f,0 0 0 13px #2a2a2e,0 40px 90px rgba(0,0,0,.9)}
 #scr{border-radius:52px}
 #desk{display:block}
 body{background:radial-gradient(circle at 50% 40%,#1a1420,#000 70%)}
}
.glitch{animation:gl .4s steps(2) 2}
@keyframes gl{0%{filter:none;transform:none}25%{filter:hue-rotate(90deg) contrast(1.8);transform:translate(4px,-2px)}50%{filter:invert(1);transform:translate(-5px,1px)}75%{filter:saturate(4) brightness(1.4);transform:translate(2px,3px)}100%{filter:none;transform:none}}
/* start */
#start{position:absolute;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;padding:32px;transition:opacity .6s}
#start.gone{opacity:0;pointer-events:none}
.st{max-width:340px;text-align:left}
.st h1{font-size:44px;letter-spacing:10px;font-weight:800;margin-bottom:26px;color:#ddd}
.st p.lore{font-size:16px;line-height:1.65;color:#aaa;margin-bottom:34px}
.st p.lore i{color:#ddd;font-style:normal}
.stbtn{display:block;text-align:center;border:1px solid #444;border-radius:30px;padding:16px;font-size:16px;letter-spacing:2px;animation:pulse 2.4s infinite}
@keyframes pulse{50%{border-color:#aaa;box-shadow:0 0 30px rgba(255,255,255,.08)}}
.st small{display:block;text-align:center;color:#555;font-size:12px;margin-top:14px}
.st .rst{color:#777;text-decoration:underline;margin-top:18px;font-size:13px}
#rot{display:none;position:fixed;inset:0;z-index:500;background:#000;align-items:center;justify-content:center;text-align:center;color:#aaa;font-size:16px;padding:30px}
@media (orientation:landscape) and (max-height:520px){#rot{display:flex}}
/* boot */
#boot{position:absolute;inset:0;z-index:150;background:#000;display:none;align-items:center;justify-content:center;transition:opacity .7s}
#boot.on{display:flex}#boot.fade{opacity:0}
#boot b{font-size:34px;font-weight:300;letter-spacing:8px;opacity:0;animation:logo 2.6s .4s forwards}
@keyframes logo{0%{opacity:0;filter:blur(8px)}40%{opacity:1;filter:none;text-shadow:0 0 24px rgba(255,255,255,.6)}100%{opacity:1}}
/* status bar */
#sb{position:absolute;top:0;left:0;right:0;height:calc(42px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 24px 0;display:flex;align-items:center;justify-content:space-between;z-index:85;font-size:15px;font-weight:600;touch-action:none}
#sb .r{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
#sb svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}
#loc{display:none}#loc.on{display:block;animation:blink 1.2s infinite}
#loc svg{fill:#0a84ff;stroke:none}
@keyframes blink{50%{opacity:.3}}
.bat{width:25px;height:12px;border:1.5px solid rgba(255,255,255,.55);border-radius:4px;padding:1.5px}
.bat i{display:block;height:100%;background:#fff;border-radius:1.5px}
.bat.low i{background:#ff453a}
/* lock */
#lock{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;padding-top:calc(76px + env(safe-area-inset-top));background:#000 center/cover;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .45s;touch-action:none}
#lock.on{display:flex}
#lock::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.1) 40%,rgba(0,0,0,.65))}
#lock>*{position:relative}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.ldate{font-size:19px;font-weight:600;opacity:.9}
.ltime{font-size:86px;font-weight:700;letter-spacing:-2px;line-height:1;margin-top:2px}
.lnot{width:calc(100% - 24px);margin-top:30px;display:flex;flex-direction:column;gap:8px}
.ln{background:rgba(40,40,46,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px;padding:11px 14px;font-size:14px;line-height:1.35;text-align:left}
.ln b{display:block;font-size:12px;opacity:.65;font-weight:600;margin-bottom:2px;letter-spacing:.3px}
.lswipe{position:absolute!important;bottom:calc(40px + env(safe-area-inset-bottom));font-size:14px;opacity:.75;animation:bob 2s infinite;padding:10px 20px}
@keyframes bob{50%{transform:translateY(-6px);opacity:1}}
/* home */
#home{position:absolute;inset:0;background:radial-gradient(120% 80% at 25% 0%,#3b2a48 0%,#1b1424 42%,#07060a 100%);padding:calc(54px + env(safe-area-inset-top)) 16px 0}
.wd{border-radius:22px;background:rgba(255,255,255,.09);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-end}
.wt{font-size:46px;font-weight:300;line-height:1}
.wdd{font-size:14px;opacity:.75;margin-top:6px}
.ww{text-align:right;font-size:13px;opacity:.85;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;margin-top:22px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer}
.ic:active .sq{filter:brightness(.7)}
.sq{width:60px;height:60px;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.sq svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic span{font-size:11.5px;text-shadow:0 1px 2px #000;white-space:nowrap}
.badge{position:absolute;top:-6px;left:calc(50% + 18px);background:#ff3b30;border-radius:11px;min-width:22px;height:22px;font-size:13px;font-style:normal;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}
.calic{background:#fff;flex-direction:column;color:#000}
.calic small{color:#ff3b30;font-size:10px;font-weight:600;margin-top:2px}
.calic b{font-size:28px;font-weight:400;line-height:1}
.dock{position:absolute;left:10px;right:10px;bottom:calc(16px + env(safe-area-inset-bottom));height:90px;border-radius:32px;background:rgba(255,255,255,.12);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
/* app */
#appv{position:absolute;inset:0;background:#000;z-index:20;transform:scale(.55);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .22s;display:flex;flex-direction:column;padding-top:calc(42px + env(safe-area-inset-top))}
#appv.open{transform:none;opacity:1;pointer-events:auto}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 8px;min-height:44px;flex:none}
.bk{color:#0a84ff;font-size:17px;display:flex;align-items:center;padding:6px;cursor:pointer;justify-self:start}
.bk svg{width:22px;height:22px;stroke:#0a84ff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hdt{font-weight:600;font-size:16px;text-align:center;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr{justify-self:end;color:#0a84ff;padding:6px 10px}
.tt{font-size:32px;font-weight:700;padding:2px 18px 10px;flex:none}
.sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:50px;touch-action:pan-y}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;position:relative}
.row::after{content:"";position:absolute;left:72px;right:0;bottom:0;border-bottom:.5px solid #2a2a2c}
.row:active{background:#1c1c1e}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:19px;flex:none}
.av.sm{width:34px;height:34px;font-size:14px}
.rc{flex:1;min-width:0}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.r1 b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 small{color:#8e8e93;font-size:13px;flex:none}
.r2{color:#8e8e93;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#0a84ff;flex:none}
.red{color:#ff453a!important}
.chat{padding:8px 12px 20px;display:flex;flex-direction:column;gap:3px}
.b{max-width:78%;padding:8px 13px;border-radius:19px;font-size:16px;line-height:1.32;-webkit-user-select:text;user-select:text}
.b.in{background:#262529;align-self:flex-start;border-bottom-left-radius:6px}
.b.out{background:#0a84ff;align-self:flex-end;border-bottom-right-radius:6px}
.sep{text-align:center;color:#8e8e93;font-size:12px;margin:14px 0 6px}
.fail{align-self:flex-end;color:#ff453a;font-size:11.5px;margin:1px 4px 4px}
.inp{display:flex;gap:8px;padding:8px 10px calc(30px + env(safe-area-inset-bottom));border-top:.5px solid #222;flex:none}
.inp input{flex:1;background:#1c1c1e;border:1px solid #333;border-radius:20px;padding:9px 14px;color:#fff;font-size:16px;min-width:0}
.send{width:36px;height:36px;border-radius:50%;background:#0a84ff;border:0;color:#fff;font-size:20px;font-weight:700}
.tabs{display:flex;border-top:.5px solid #2a2a2c;background:#0d0d0f;padding-bottom:calc(22px + env(safe-area-inset-bottom));flex:none}
.tab{flex:1;text-align:center;padding:10px 0 4px;font-size:11px;color:#8e8e93;cursor:pointer}
.tab.on{color:#0a84ff}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.cnt{text-align:center;color:#8e8e93;font-size:13px;padding:16px}
.albs{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:6px 16px}
.alb{cursor:pointer}
.alb div{aspect-ratio:1;border-radius:10px;background:#1c1c1e center/cover;display:flex;align-items:center;justify-content:center;font-size:36px}
.alb b{display:block;font-size:15px;font-weight:500;margin-top:6px}
.alb small{color:#8e8e93;font-size:13px}
.pv{flex:1;display:flex;align-items:center;justify-content:center;background:#000;min-height:0}
.pv img{max-width:100%;max-height:100%;object-fit:contain}
.pinfo{padding:12px 18px;display:flex;flex-direction:column;gap:3px;font-size:14px;color:#aaa;flex:none}
.pinfo b{color:#fff;font-size:16px}
.pnav{display:flex;justify-content:space-between;padding:0 18px calc(34px + env(safe-area-inset-bottom));font-size:32px;color:#0a84ff;flex:none}
.pnav span{padding:4px 18px;cursor:pointer}
.pinv{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:30px;gap:8px}
.pinv .lk{font-size:40px}
.pinv small{color:#8e8e93;text-align:center;padding:0 30px}
.pdots{display:flex;gap:16px;margin:22px 0}
.pdots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff}
.pdots i.f{background:#fff}
.pk{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}
.pk div{width:76px;height:76px;border-radius:50%;background:#2c2c2e;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}
.pk div:active{background:#555}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.note{padding:6px 20px 40px;font-size:17px;line-height:1.55;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.note small{display:block;color:#8e8e93;font-size:13px;margin-bottom:12px;text-align:center}
.nrow{padding:12px 18px;border-bottom:.5px solid #2a2a2c;cursor:pointer}
.nrow b{font-size:16px;display:block}
.nrow span{color:#8e8e93;font-size:14px}
.grp{margin:8px 16px 20px;background:#1c1c1e;border-radius:12px;overflow:hidden}
.gi{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:.5px solid #2c2c2e;font-size:16px;cursor:pointer;gap:10px}
.gi:last-child{border-bottom:0}
.gi small{color:#8e8e93;font-size:15px;text-align:right}
.gh{color:#8e8e93;font-size:13px;padding:0 32px;text-transform:uppercase;margin-top:8px}
.sw{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:#30d158}.sw.on::after{transform:translateX(20px)}
.btn{display:block;text-align:center;background:#0a84ff;color:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:600;margin:14px 16px;cursor:pointer;border:0;width:calc(100% - 32px)}
.btn.dng{background:#3a1212;color:#ff453a}
.lnk{color:#0a84ff;text-align:center;padding:12px;cursor:pointer;font-size:15px}
.fine{color:#8e8e93;font-size:13px;padding:0 24px;line-height:1.4}
.acc{display:flex;align-items:center;gap:14px;margin:6px 16px 18px;background:#1c1c1e;border-radius:12px;padding:14px;cursor:pointer}
.acc small{display:block;color:#8e8e93;font-size:13px}
.fcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px}
.fic{width:74px;height:74px;border-radius:18px;background:linear-gradient(#34c759,#0a7a2a);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.fic svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:1.8}
.fcard span{color:#8e8e93;font-size:14px}
.pwv{display:flex;flex-direction:column;align-items:center;padding-top:20px}
.pwv h2{font-size:22px;margin-top:6px}.pwv p{color:#8e8e93;margin:4px 0 18px}
.pwv form{width:100%}
.pwv input{display:block;width:calc(100% - 32px);margin:0 16px;background:#1c1c1e;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;font-size:17px}
.err{color:#ff453a;font-size:14px;text-align:center;min-height:20px;margin-top:8px}
/* call overlay */
#ov{position:absolute;inset:0;z-index:90;display:none}
#ov.on{display:block}
.call{position:absolute;inset:0;background:linear-gradient(#2b2f3a,#0b0c10);display:flex;flex-direction:column;align-items:center;padding:calc(80px + env(safe-area-inset-top)) 20px calc(50px + env(safe-area-inset-bottom))}
.cav{width:90px;height:90px;border-radius:50%;background:#555;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:600}
.cname{font-size:30px;font-weight:500;margin-top:16px;text-align:center}
.csub{color:#aaa;margin-top:6px;font-size:16px}
.clines{flex:1;width:100%;overflow-y:auto;margin:24px 0 10px;display:flex;flex-direction:column;gap:10px;font-size:15.5px;line-height:1.45}
.cln{color:#ddd;background:rgba(255,255,255,.06);padding:10px 12px;border-radius:12px;animation:fin .5s}
.cln.me{color:#9cc7ff;align-self:flex-end;text-align:right}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
.copts{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.copt{background:rgba(255,255,255,.12);border-radius:14px;padding:13px;text-align:center;font-size:15.5px;cursor:pointer}
.copt:active{background:rgba(255,255,255,.25)}
.cbtns{display:flex;gap:80px}
.cbtn{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cbtn svg{width:34px;height:34px}
.cbtn.r{background:#ff3b30}.cbtn.r svg{transform:rotate(135deg)}
.cbtn.g{background:#30d158}
.inc .cbtn{animation:pulse2 1s infinite}
@keyframes pulse2{50%{transform:scale(1.08)}}
/* banner, shade, toast */
#ban{position:absolute;top:0;left:8px;right:8px;z-index:96;background:rgba(44,44,48,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:11px 13px;display:flex;gap:11px;align-items:center;transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,.9,.3,1.2);cursor:pointer}
#ban.show{transform:translateY(calc(44px + env(safe-area-inset-top)))}
#ban .sq{width:38px;height:38px;border-radius:10px;flex:none}
#ban .sq svg{width:22px;height:22px}
#ban div.t{flex:1;min-width:0;font-size:14px;line-height:1.3}
#ban b{display:block;font-size:14px}
#ban span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#shade{position:absolute;inset:0;z-index:88;background:rgba(10,10,14,.88);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);transform:translateY(-102%);transition:transform .38s cubic-bezier(.3,.8,.2,1);padding:calc(48px + env(safe-area-inset-top)) 14px 0;display:flex;flex-direction:column;touch-action:none}
#shade.open{transform:none}
.shtime{font-size:40px;font-weight:300}.shdate{color:#aaa;font-size:14px;margin-bottom:14px}
.qt{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.q{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:#aaa;cursor:pointer}
.q i{width:52px;height:52px;border-radius:50%;background:#2c2c2e;display:flex;align-items:center;justify-content:center}
.q i svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
.q.on i{background:#0a84ff}
.snl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;touch-action:none;overscroll-behavior:contain}
.sn{cursor:pointer}
.sn{background:rgba(255,255,255,.08);border-radius:16px;padding:11px 14px;font-size:14px;line-height:1.35}
.sn b{display:block;font-size:11px;color:#999;letter-spacing:.4px;margin-bottom:2px}
.sn span{color:#bbb}
.sn.warn{background:rgba(255,69,58,.2);margin-bottom:8px}
.none{color:#666;text-align:center;padding:30px}
.shclose{padding:16px 0 calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:center;cursor:pointer}
.shclose i{width:40px;height:5px;border-radius:3px;background:#666}
#toast{position:absolute;left:24px;right:24px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:97;background:rgba(50,50,54,.96);border-radius:14px;padding:13px 16px;font-size:14.5px;line-height:1.4;text-align:center;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:none}
#hbz{position:absolute;bottom:0;left:50%;width:170px;transform:translateX(-50%);height:24px;z-index:86;touch-action:none;cursor:pointer}
#hbz i{position:absolute;bottom:8px;left:18px;right:18px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}
/* keypad */
.kd{text-align:center;font-size:36px;min-height:50px;padding:10px;letter-spacing:2px}
.ksub{text-align:center;color:#ff9f0a;font-size:13px;margin-bottom:14px}
.kp{display:grid;grid-template-columns:repeat(3,78px);gap:14px 24px;justify-content:center}
.kp div{width:78px;height:78px;border-radius:50%;background:#2c2c2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;cursor:pointer}
.kp div:active{background:#666}
.kp small{font-size:9px;letter-spacing:2px;color:#aaa}
.kcall{display:flex;justify-content:center;gap:40px;align-items:center;margin-top:18px}
.kcall .cbtn{width:78px;height:78px}
.kcall span{color:#aaa;font-size:15px;cursor:pointer;width:60px}
/* camera */
.camv{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
#vf{position:absolute;left:0;right:0;top:12%;height:66%;width:100%;image-rendering:auto}
.camtop{position:relative;z-index:2}
